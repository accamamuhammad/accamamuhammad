<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Accama Muhammad Hussaini - web developer climbing toward backend and AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1200M0 120H1200M0 180H1200"/>
    <path d="M200 0V240M400 0V240M600 0V240M800 0V240M1000 0V240"/>
  </g>

  <!-- flight path -->
  <path id="route" d="M60 200 C320 120 620 230 1120 60" fill="none" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="60" cy="200" r="5" fill="#93c5fd"/>
  <circle cx="1120" cy="60" r="5" fill="none" stroke="#93c5fd" stroke-width="2"/>

  <!-- plane -->
  <g fill="#ffffff">
    <ellipse cx="0" cy="0" rx="24" ry="4.5"/>
    <polygon points="-4,0 -14,-17 -8,-17 8,0"/>
    <polygon points="-4,0 -14,17 -8,17 8,0"/>
    <polygon points="-18,0 -25,-8 -20,-8 -13,0"/>
    <polygon points="-18,0 -25,8 -20,8 -13,0"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </g>

  <!-- text -->
  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0.5">Accama Muhammad Hussaini</text>
  <text x="600" y="150" text-anchor="middle" fill="#bfdbfe" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="1">WEB DEVELOPER  ›  PYTHON  ›  BACKEND  ›  AI</text>
</svg>
